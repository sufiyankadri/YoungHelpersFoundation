<div class="site-wrapper">
  <!-- Shared Top Bar & Main Navigation Header -->
  <app-navbar></app-navbar>

  <!-- Modular Active Tab Feature Routing -->
  <main class="main-content" id="main-content" tabindex="-1">
    @switch (causeService.activeTab()) {
      @case ('home') {
        <app-home></app-home>
      }
      @case ('causes') {
        <app-causes></app-causes>
      }
      @case ('rozgaar') {
        <app-rozgaar></app-rozgaar>
      }
      @case ('calculator') {
        <app-calculator></app-calculator>
      }
      @case ('about') {
        <app-about></app-about>
      }
      @case ('volunteer') {
        <app-volunteer></app-volunteer>
      }
      @case ('transparency') {
        <app-transparency></app-transparency>
      }
      @case ('faq') {
        <app-faq></app-faq>
      }
      @case ('apply') {
        <app-apply></app-apply>
      }
      @case ('admin') {
        <app-admin></app-admin>
      }
    }
  </main>

  <!-- Universal Contribution Modal -->
  <app-donate-modal></app-donate-modal>

  <!-- Shared Global Footer -->
  <app-footer></app-footer>
</div>
