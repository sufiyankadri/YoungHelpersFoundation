<article class="discovery-card">
  <button
    type="button"
    class="discovery-image"
    (click)="navigation.openCause(cause.slug)"
    [attr.aria-label]="'Read example: ' + cause.title"
  >
    <img
      [src]="cause.coverImage"
      alt=""
      width="1536"
      height="1024"
      loading="lazy"
      decoding="async"
    /><span>{{ categoryLabel() }}</span>
  </button>
  <div class="discovery-body">
    <div class="discovery-meta">
      <span>{{ cause.location }}</span
      ><span>ILLUSTRATIVE EXAMPLE</span>
    </div>
    <h3>
      <button type="button" (click)="navigation.openCause(cause.slug)">{{ cause.title }}</button>
    </h3>
    <p>{{ cause.tagline }}</p>
    <div class="sample-budget">
      <span
        >Sample progress <strong>{{ progress | number: '1.0-0' }}%</strong></span
      >
      <div class="budget-track" aria-hidden="true"><span [style.width.%]="progress"></span></div>
      <div>
        <span
          >Example raised <b>{{ money(cause.raisedAmount) }}</b></span
        ><span
          >Example goal <b>{{ money(cause.targetAmount) }}</b></span
        >
      </div>
    </div>
    <button type="button" class="discovery-link" (click)="navigation.openCause(cause.slug)">
      Read the example <span aria-hidden="true">↗</span></button
    ><small class="not-live">Not a live fundraising appeal.</small>
  </div>
</article>
