<a class="skip-nav" href="#main-content">Skip to content</a>
<div class="top-announcement">
  <div class="container utility-content">
    <p><span class="utility-dot" aria-hidden="true"></span>Helping today. Building livelihoods for tomorrow.</p>
    <button type="button" class="portal-link" (click)="navigate('admin')">Operations portal <span aria-hidden="true">↗</span></button>
  </div>
</div>
<header class="main-nav" (focusout)="onFocusOut($event)">
  <div class="container nav-content">
    <button type="button" class="brand" aria-label="Young Helpers Foundation home" (click)="navigate('home')">
      <img src="logo.jpeg" alt="" class="brand-logo" width="1280" height="853">
      <span class="brand-name">Young Helpers<small>FOUNDATION</small></span>
    </button>
    <nav class="nav-links" aria-label="Main navigation" [class.mobile-expanded]="mobileOpen()" id="primary-navigation">
      <button type="button" class="nav-btn" [class.active]="causeService.activeTab() === 'home'" [attr.aria-current]="causeService.activeTab() === 'home' ? 'page' : null" (click)="navigate('home')">Home</button>
      <button type="button" class="nav-btn" [class.active]="causeService.activeTab() === 'causes'" (click)="explore()">Explore causes</button>
      @for (group of groups; track group.id) {
        <div class="nav-group" [class.is-open]="openGroup() === group.id">
          <button type="button" class="nav-btn group-trigger" [class.active]="groupActive(group)"
            [attr.aria-expanded]="openGroup() === group.id" [attr.aria-controls]="'submenu-' + group.id"
            (click)="toggleGroup(group.id, $event)" (keydown)="openWithKeyboard(group.id, $event)">
            {{ group.label }}<span class="chevron" aria-hidden="true"></span>
          </button>
          @if (openGroup() === group.id) {
            <div class="nav-dropdown" [id]="'submenu-' + group.id">
              <p class="dropdown-heading">{{ group.label }}</p>
              @for (item of group.items; track item.label) {
                <button type="button" class="dropdown-link" (click)="select(item)">
                  <span class="dropdown-icon material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
                  <span><strong>{{ item.label }}</strong><small>{{ item.description }}</small></span>
                  <span class="dropdown-arrow" aria-hidden="true">↗</span>
                </button>
              }
            </div>
          }
        </div>
      }
      <div class="mobile-actions">
        <button type="button" class="btn btn-outline" (click)="navigate('apply')">Apply for help</button>
        <button type="button" class="btn btn-primary" (click)="openDonate()">Support our work</button>
      </div>
    </nav>
    <div class="nav-cta">
      <button type="button" class="btn btn-outline btn-sm apply-action" (click)="navigate('apply')">Apply for help</button>
      <button type="button" class="btn btn-primary btn-sm donate-action" (click)="openDonate()">Donate <span aria-hidden="true">↗</span></button>
      <button type="button" class="mobile-toggle" aria-controls="primary-navigation" [attr.aria-expanded]="mobileOpen()" [attr.aria-label]="mobileOpen() ? 'Close navigation' : 'Open navigation'" (click)="toggleMobile()">
        <span class="material-symbols-outlined" aria-hidden="true">{{ mobileOpen() ? 'close' : 'menu' }}</span>
      </button>
    </div>
  </div>
</header>
